version: 0.2

phases:
  install:
    commands:
      - dotnet --info

  build:
    commands:
      - dotnet restore DevOpsReviewA6/DevOpsReviewA6.csproj
      - dotnet publish DevOpsReviewA6/DevOpsReviewA6.csproj --configuration Release --output ./publish

artifacts:
  base-directory: publish
  files:
    - '**/*'
